[package]
name = "acoustic-core"
version = "0.1.0"
edition = "2021"
description = "Sonophile acoustic physics / DSP core (compiles to wasm32 and native)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
